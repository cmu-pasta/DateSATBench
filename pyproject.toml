[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datesatbench"
version = "0.1.0"
description = "DateSATBench datasets and generators."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DateSATBench authors" }]

# Keep base install minimal; generators that use an LLM provider require extra deps.
dependencies = []

[project.optional-dependencies]
llm = [
  "python-dotenv>=1.0",
  "openai>=1.0",
  "anthropic>=0.30",
]
# eval/ also needs DateSat itself, which is not on PyPI: pip install -e <path to DateSat>
eval = [
  "matplotlib>=3.5",
  "numpy>=1.21",
  "rich",
  "pytest>=7.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["datesatbench*"]

[tool.setuptools.package-data]
datesatbench = [
  "**/*.json",
  "**/*.jsonl",
  "**/*.fan",
  "**/*.md",
]

[tool.pytest.ini_options]
# eval/ is not a package; the repo root on sys.path lets tests import eval.utils.*
pythonpath = ["."]
testpaths = ["eval"]
