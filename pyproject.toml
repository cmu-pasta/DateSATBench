[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datesatbench"
version = "0.1.0"
description = "DateSATBench datasets and generators."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DateSATBench authors" }]

# Keep base install minimal; generators that use an LLM provider require extra deps.
dependencies = []

[project.optional-dependencies]
llm = [
  "python-dotenv>=1.0",
  "openai>=1.0",
  "anthropic>=0.30",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["datesatbench*"]

[tool.setuptools.package-data]
datesatbench = [
  "**/*.json",
  "**/*.jsonl",
  "**/*.fan",
  "**/*.md",
]
datesatbench_new = [
  "**/*.json",
  "**/*.jsonl",
  "**/*.fan",
  "**/*.md",
]

